services:
  # MongoDB Database (Single Replica Set for Prisma - MongoDB 4.4)
  mongodb:
    image: mongo:6.0
    container_name: snackrapido-mongodb
    restart: unless-stopped
    ports:
      - "27019:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    networks:
      - snackrapido-network

  # Redis Cache & Pub/Sub
  redis:
    image: redis:7.2-alpine
    container_name: snackrapido-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --requirepass redis123 --loglevel verbose
    volumes:
      - redis_data:/data
    networks:
      - snackrapido-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: snackrapido-rabbitmq
    restart: unless-stopped
    ports:
      - "5673:5672"    # AMQP port
      - "15673:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: rabbit123
      RABBITMQ_DEFAULT_VHOST: /
      # Enable detailed logging
      RABBITMQ_LOGS: "-"
      RABBITMQ_SASL_LOGS: "-" 
      RABBITMQ_LOG_LEVEL: debug
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - snackrapido-network

  # MongoDB Express (Optional - Database Admin UI)
  mongo-express:
    image: mongo-express:1.0.2
    container_name: snackrapido-mongo-express
    restart: unless-stopped
    ports:
      - "8091:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://snackrapido-mongodb:27017/?replicaSet=rs0&directConnection=true
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - snackrapido-network

  # RedisInsight - Redis Admin UI (replaces redis-commander)
  redisinsight:
    image: redis/redisinsight:latest
    container_name: snackrapido-redisinsight
    restart: unless-stopped
    ports:
      - "8093:5540"
    depends_on:
      - redis
    networks:
      - snackrapido-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  snackrapido-network:
    driver: bridge